name: publicwebsite
description: MT Alchemy Member 1 corporate website prototype.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  shared_preferences: ^2.5.6
  web: ^1.1.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  http: ^1.6.0
  excel: ^4.0.6
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  fl_chart: ^1.3.0
  image: ^4.3.0
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/stock/
    - assets/downloads/
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-400.ttf
          weight: 400
        - asset: assets/fonts/Lexend-500.ttf
          weight: 500
        - asset: assets/fonts/Lexend-600.ttf
          weight: 600
        - asset: assets/fonts/Lexend-700.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-500-Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-600-Italic.ttf
          weight: 600
          style: italic
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-400.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Italic-400.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSans3-600.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-700.ttf
          weight: 700
